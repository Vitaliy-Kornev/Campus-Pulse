# Catch-all for requests that aren't for this site: bots and scanners that hit the server's IP
# address or made-up hostnames. Dropped here, so they never reach the app (or its error alarm).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Refuse the TLS handshake outright: no certificate needed, nothing about the site revealed.
    ssl_reject_handshake on;
}
