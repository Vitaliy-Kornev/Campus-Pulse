# Campus Pulse — nginx reverse proxy to gunicorn. certbot adds the HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (don't append) so the first X-Forwarded-For entry is the real client IP
        # and can't be spoofed; it's only used for daily unique-visitor hashing.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
